<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="styles.css">
    <title>CAPZONE | Contacto</title>

    <style>
        .contact-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .contact-subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }
        .contact-box {
            background-color: #18181c;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .contact-box h2 {
            color: #e63946;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 600;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f0f11;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #e63946;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }
        .btn-contact {
            width: 100%;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-contact:hover {
            background-color: #d62828;
            transform: translateY(-2px);
        }
        .contact-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }
        .info-card {
            background-color: #18181c;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
        }
        .info-card h3 {
            color: #e63946;
            margin-bottom: 10px;
        }
        .info-card p {
            color: #aaa;
        }
        @media (max-width: 700px) {
            .contact-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">

        <div class="logo"> CAPZONE </div>
<nav>
    <a href="index.html">Inicio</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="contacto.html">Contacto</a>
    <a href="suscripcion.html">Ofertas</a>
</nav>
    </header>
    <main class="contact-container">
        <h1 class="section-title"> Contáctanos </h1>
        <p class="contact-subtitle">
            ¿Tienes alguna pregunta? Escríbenos y estaremos encantados de ayudarte.
        </p>
        <div class="contact-box">
            <h2>Envíanos un mensaje</h2>
            <form>
                <div class="form-group">
                    <label for="nombre"> Nombre </label>
                    <input 
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre"
                        required> 
                </div>
                <div class="form-group">
                    <label for="correo">
                        Correo electrónico
                    </label>
                    <input 
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required>
                </div>
                <div class="form-group">
                    <label for="asunto">
                        Asunto
                    </label>
                    <input 
                        type="text"
                        id="asunto"
                        name="asunto"
                        placeholder="¿En qué podemos ayudarte?"
                        required>
                </div>
                <div class="form-group">
                    <label for="mensaje">
                        Mensaje
                    </label>
                    <textarea 
                        id="mensaje"
                        name="mensaje"
                        placeholder="Escribe tu mensaje..."
                        required>
                    </textarea>
                </div>
               <button 
                    type="submit" 
                    class="btn-contact">
                    Enviar mensaje
                </button>
            </form>
        </div>
        <div class="contact-info">
            <div class="info-card">
                <h3>Correo</h3>
                <p>fernando.gonzalez@institutocelsus.edu.mx</p>
            </div>
            <div class="info-card">
                <h3>Horario</h3>
                <p>Lunes a Viernes</p>
            </div>
            <div class="info-card">
                <h3>CAPZONE</h3>
                <p>Tu estilo, tu gorra.</p>
            </div>
        </div>
    </main>
    <footer>
        <p>
            &copy; 2026 CAPZONE. DERECHOS RESERVADOS DE FER
        </p>
    </footer>
</body>
</html>
